services:
  postgres:
    # Use ECR Public mirror to avoid Docker Hub TLS/handshake issues.
    image: public.ecr.aws/docker/library/postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: juri4
    ports:
      # Default to non-standard host port to avoid conflicts with local Postgres.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - apps/backend/.env
    depends_on:
      - postgres
    ports:
      - "${BACKEND_PORT:-4080}:4000"
    volumes:
      - uploads:/data/uploads
    command: >
      sh -c "mkdir -p /data/uploads &&
             npx prisma migrate deploy --schema=prisma/schema.prisma &&
             npm run -w backend start"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    env_file:
      - apps/frontend/.env
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3080}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
